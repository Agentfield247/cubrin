<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cubrin - Support & Contact</title>

        <!-- Importing Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=MuseoModerno:ital,wght@0,100..900;1,100..900&family=Inter:wght@400;500;600&display=swap"
            rel="stylesheet"
        />

        <style>
            :root {
                /* Cubrin Brand Colors */
                --bg-cream: #fdfcf7;
                --text-dark: #1b1e25;
                --text-gray: #4b5563;
                --nav-gray: #374151;
                --btn-dark-green: #0a4f1a;
                --gradient-start: #31ed5d;
                --gradient-end: #d8ff14;
                --card-bg: #ffffff;

                --font-head: "MuseoModerno", sans-serif;
                --font-body: "Inter", sans-serif;
            }

            body {
                background-color: var(--bg-cream);
                color: var(--text-dark);
                font-family: var(--font-body);
                margin: 0;
                padding: 0;
                line-height: 1.6;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }

            /* --- NAVIGATION --- */
            .navbar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 24px 5%;
                max-width: 1400px;
                margin: 0 auto;
                width: 100%;
                box-sizing: border-box;
            }

            .logo {
                height: 45px;
                width: auto;
            }

            .nav-links {
                display: flex;
                gap: 35px;
                align-items: center;
            }

            .nav-links a {
                text-decoration: none;
                color: var(--nav-gray);
                font-weight: 600;
                font-size: 0.95rem;
                transition: color 0.2s;
            }

            .nav-links a:hover {
                color: var(--btn-dark-green);
            }

            .btn-primary {
                background-color: var(--btn-dark-green);
                color: #ffffff;
                text-decoration: none;
                padding: 12px 28px;
                border-radius: 50px;
                font-weight: 600;
                font-size: 0.95rem;
                transition:
                    transform 0.2s,
                    background-color 0.2s;
                border: none;
                cursor: pointer;
            }

            .btn-primary:hover {
                background-color: #073b12;
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(10, 79, 26, 0.2);
            }

            /* --- SUPPORT SECTION --- */
            .support-container {
                max-width: 1200px;
                margin: 40px auto 80px;
                padding: 0 5%;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 60px;
                align-items: center;
            }

            /* Left Side: Text content */
            .support-text h1 {
                font-family: var(--font-head);
                font-size: 4rem;
                font-weight: 900;
                line-height: 1.1;
                margin: 0 0 20px 0;
                letter-spacing: -0.03em;
            }

            .text-gradient {
                background: linear-gradient(
                    90deg,
                    var(--gradient-start),
                    var(--gradient-end)
                );
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                color: transparent;
            }

            .support-text p {
                font-size: 1.15rem;
                color: var(--text-gray);
                margin-bottom: 40px;
                max-width: 450px;
            }

            .contact-info-block {
                margin-top: 30px;
            }

            .contact-method {
                display: flex;
                align-items: center;
                gap: 15px;
                margin-bottom: 20px;
            }

            .contact-icon {
                width: 45px;
                height: 45px;
                background: rgba(49, 237, 93, 0.1);
                border-radius: 50%;
                display: flex;
                justify-content: center;
                align-items: center;
                color: var(--btn-dark-green);
                font-size: 1.2rem;
            }

            .contact-details h4 {
                margin: 0;
                font-family: var(--font-head);
                font-size: 1.1rem;
                color: var(--text-dark);
            }

            .contact-details a,
            .contact-details span {
                color: var(--text-gray);
                text-decoration: none;
                font-size: 0.95rem;
            }

            /* Right Side: Form */
            .support-form-card {
                background: var(--card-bg);
                padding: 40px;
                border-radius: 24px;
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
                border: 1px solid #f3f4f6;
            }

            .form-group {
                margin-bottom: 20px;
            }

            .form-group label {
                display: block;
                font-weight: 600;
                font-size: 0.9rem;
                margin-bottom: 8px;
                color: var(--text-dark);
            }

            .optional-tag {
                color: #9ca3af;
                font-weight: 400;
                font-size: 0.8rem;
                margin-left: 5px;
            }

            .form-control {
                width: 100%;
                padding: 15px 20px;
                border: 2px solid #e5e7eb;
                border-radius: 12px;
                font-family: var(--font-body);
                font-size: 1rem;
                color: var(--text-dark);
                background-color: #fafafa;
                transition: all 0.3s ease;
                box-sizing: border-box;
            }

            .form-control:focus {
                outline: none;
                border-color: var(--gradient-start);
                background-color: #ffffff;
                box-shadow: 0 0 0 4px rgba(49, 237, 93, 0.1);
            }

            textarea.form-control {
                resize: vertical;
                min-height: 120px;
            }

            .submit-btn {
                width: 100%;
                background-color: var(--btn-dark-green);
                color: #ffffff;
                padding: 16px;
                font-family: var(--font-head);
                font-size: 1.15rem;
                font-weight: 700;
                border: none;
                border-radius: 12px;
                cursor: pointer;
                transition: all 0.3s ease;
                margin-top: 10px;
            }

            .submit-btn:hover {
                background-color: #073b12;
                transform: translateY(-2px);
                box-shadow: 0 8px 20px rgba(10, 79, 26, 0.2);
            }

            /* --- RESPONSIVE --- */
            @media (max-width: 992px) {
                .support-container {
                    grid-template-columns: 1fr;
                    gap: 40px;
                }
                .support-text h1 {
                    font-size: 3.5rem;
                }
                .nav-links {
                    display: none; /* Hide on mobile for simplicity, or add a hamburger menu */
                }
            }

            @media (max-width: 768px) {
                .support-text h1 {
                    font-size: 2.8rem;
                }
                .support-form-card {
                    padding: 25px;
                }
            }
        </style>
    </head>
    <body>
        <!-- NAVBAR -->
        <nav class="navbar">
            <a href="https://cubrin.com">
                <img src="cubrinlogo.svg" alt="Cubrin Logo" class="logo" />
            </a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="faqs.html">FAQs</a>
                <a href="#">Ambassadors</a>
                <a href="terms.html" style="color: var(--btn-dark-green)"
                    >Legals</a
                >
            </div>
            <a href="comingsoon.html" class="btn-primary">Download Now</a>
        </nav>

        <!-- MAIN SUPPORT SECTION -->
        <main class="support-container">
            <!-- Left Side: Header & Info -->
            <div class="support-text">
                <h1>We're here to <span class="text-gradient">help.</span></h1>
                <p>
                    Having trouble with an order? Want to partner with us? Drop
                    us a message and our team will get back to you as soon as
                    possible.
                </p>

                <div class="contact-info-block">
                    <div class="contact-method">
                        <div class="contact-icon">✉</div>
                        <div class="contact-details">
                            <h4>Email Us</h4>
                            <a href="mailto:contact@cubrin.com"
                                >contact@cubrin.com</a
                            >
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Side: Contact Form -->
            <div class="support-form-card">
                <!-- Action uses mailto to open user's default email client pre-filled, mapping directly to your official email -->
                <form
                    action="mailto:contact@cubrin.com"
                    method="POST"
                    enctype="text/plain"
                >
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input
                            type="text"
                            id="name"
                            name="Name"
                            class="form-control"
                            placeholder="Jane Doe"
                            required
                        />
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input
                            type="tel"
                            id="phone"
                            name="Phone Number"
                            class="form-control"
                            placeholder="+234 800 000 0000"
                            required
                        />
                    </div>

                    <div class="form-group">
                        <label for="address"
                            >Delivery Address
                            <span class="optional-tag">(Optional)</span></label
                        >
                        <input
                            type="text"
                            id="address"
                            name="Address"
                            class="form-control"
                            placeholder="123 Campus Road, Block A"
                        />
                    </div>

                    <div class="form-group">
                        <label for="message">How can we help?</label>
                        <textarea
                            id="message"
                            name="Message"
                            class="form-control"
                            placeholder="Write your message here..."
                            required
                        ></textarea>
                    </div>

                    <button type="submit" class="submit-btn">
                        Send Message
                    </button>
                </form>
            </div>
        </main>
    </body>
</html>
