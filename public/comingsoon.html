<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cubrin — Download the App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=MuseoModerno:wght@700;900&display=swap" rel="stylesheet" />
    <style>
        body {
            background-color: #FFFDF7;
            color: #143D01;
            font-family: 'Inter', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            flex-direction: column;
            padding: 20px;
        }
        .hidden {
            display: none !important;
        }
        .logo {
            width: 120px;
            margin-bottom: 30px;
        }
        h1 {
            font-family: 'MuseoModerno', sans-serif;
            font-weight: 900;
            font-size: 2.5rem;
            margin: 0 0 10px 0;
        }
        p {
            color: #4b5563;
            margin: 0 0 25px 0;
        }
        .store-btns {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .store-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #143D01;
            color: white;
            padding: 14px 28px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
        }
        .store-btn:hover {
            background: #1a4f02;
            transform: translateY(-2px);
        }
        .store-btn.apple {
            background: black;
        }
        .store-btn.apple:hover {
            background: #1a1a1a;
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(22, 255, 103, 0.3);
            border-top-color: #16FF67;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="loading">
        <img src="cubrinlogo.svg" alt="Cubrin" class="logo" />
        <div class="loading-spinner"></div>
        <h1>Redirecting you to the app store…</h1>
        <p>Please wait a moment.</p>
    </div>

    <div id="fallback" class="hidden">
        <img src="cubrinlogo.svg" alt="Cubrin" class="logo" />
        <h1>Download Cubrin</h1>
        <p>Choose your platform to get the app.</p>
        <div class="store-btns">
            <a href="https://apps.apple.com/ng/app/cubrin/id6794402083" class="store-btn apple" target="_blank" rel="noopener noreferrer">
                <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.19 2.31-.88 3.5-.8 1.49.09 2.58.62 3.2 1.48-2.61 1.54-2.18 4.7.42 5.76-.63 1.94-1.76 4.09-2.2 4.73zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
                App Store
            </a>
            <a href="https://play.google.com/store/apps/details?id=com.cubrin.mobile&hl=en_ZA" class="store-btn" target="_blank" rel="noopener noreferrer">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4ADE80" d="M3.13 2.1c-.24.23-.38.58-.38 1v17.8c0 .42.14.77.38 1l.05.05 9.4-9.4v-.1l-9.4-9.4-.05.05z"/><path fill="#FFC107" d="M12.58 12.55l3.23 3.23 1.03-.59 3.03-1.74c.86-.49.86-1.3 0-1.79l-3.03-1.74-1.03-.59-3.23 3.22z"/><path fill="#F44336" d="M12.58 12.55L3.13 22l-.05-.05 10.53-6.02-1.03-3.38z"/><path fill="#2196F3" d="M3.08 2.15L12.58 12.55l1.03-3.38L3.08 3.15c-.24-.14-.5-.14-.76 0l.76-1z"/></svg>
                Google Play
            </a>
        </div>
    </div>

    <script>
        function getMobileOperatingSystem() {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                return "iOS";
            }
            if (/android/i.test(userAgent)) {
                return "Android";
            }
            return "unknown";
        }

        function redirectToStore() {
            const os = getMobileOperatingSystem();
            const appleLink = "https://apps.apple.com/ng/app/cubrin/id6794402083";
            const androidLink = "https://play.google.com/store/apps/details?id=com.cubrin.mobile&hl=en_ZA";

            if (os === "iOS") {
                window.location.href = appleLink;
            } else if (os === "Android") {
                window.location.href = androidLink;
            } else {
                // Desktop or unknown: show fallback
                document.getElementById("loading").classList.add("hidden");
                document.getElementById("fallback").classList.remove("hidden");
            }
        }

        window.onload = redirectToStore;
    </script>
</body>
</html>
