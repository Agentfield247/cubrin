<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cubrin - Search Results</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            "cubrin-green": "#143D01",
                            "cubrin-yellow": "#EBFC04",
                        },
                        fontFamily: { museo: ['"MuseoModerno"', "sans-serif"] },
                    },
                },
            };
        </script>
    </head>
    <body class="bg-white min-h-screen flex flex-col font-sans">
        <header class="border-b border-gray-100 sticky top-0 bg-white z-50">
            <div
                class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between gap-4"
            >
                <div class="flex items-center gap-6">
                    <a href="index.html" class="flex-shrink-0">
                        <img
                            src="./cubrinlogo.svg"
                            alt="Cubrin"
                            class="h-8 w-auto"
                        />
                    </a>

                    <div
                        class="hidden md:flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-2 rounded-lg transition-colors"
                    >
                        <svg
                            class="w-5 h-5 text-[#143D01]"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.243-4.243a8 8 0 1111.314 0z"
                            ></path>
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"
                            ></path>
                        </svg>
                        <div>
                            <p
                                class="text-[10px] font-bold text-gray-500 uppercase tracking-wider"
                            >
                                Delivery To
                            </p>
                            <p
                                class="text-sm font-bold text-gray-900"
                                id="current-location-display"
                            >
                                Lagos, Nigeria
                            </p>
                        </div>
                        <svg
                            class="w-4 h-4 text-gray-400"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M19 9l-7 7-7-7"
                            ></path>
                        </svg>
                    </div>
                </div>

                <div class="flex-1 max-w-2xl hidden md:block">
                    <div
                        class="relative flex items-center w-full h-12 rounded-lg bg-gray-50 border border-transparent focus-within:bg-white focus-within:border-gray-200 overflow-hidden transition-colors"
                    >
                        <div
                            class="grid place-items-center h-full w-12 text-gray-400"
                        >
                            <svg
                                class="h-5 w-5"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                                />
                            </svg>
                        </div>
                        <input
                            class="peer h-full w-full outline-none text-sm text-gray-700 bg-transparent pr-2"
                            type="text"
                            id="search"
                            placeholder="Food, drinks, groceries etc"
                        />
                    </div>
                </div>

                <div class="flex items-center gap-4 flex-shrink-0">
                    <button
                        class="p-2 hover:bg-gray-50 rounded-full transition-colors"
                    >
                        <svg
                            class="w-6 h-6 text-gray-600"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"
                            ></path>
                        </svg>
                    </button>
                    <button
                        class="flex items-center gap-2 p-2 hover:bg-gray-50 rounded-full transition-colors font-bold text-gray-700"
                    >
                        <svg
                            class="w-6 h-6"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"
                            ></path>
                        </svg>
                        <span>0</span>
                    </button>
                    <a
                        href="#"
                        class="hidden sm:flex bg-[#143D01] text-white px-6 py-2.5 rounded-full font-bold hover:bg-[#1a4f02] transition-colors items-center gap-2"
                    >
                        <svg
                            class="w-4 h-4"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                            ></path>
                        </svg>
                        Login
                    </a>
                </div>
            </div>

            <div
                class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center gap-3 overflow-x-auto hide-scroll border-t border-gray-100"
            >
                <button
                    class="flex items-center gap-2 whitespace-nowrap px-4 py-1.5 rounded-full border border-gray-200 text-sm font-semibold text-gray-700 hover:bg-gray-50"
                >
                    <svg
                        class="w-4 h-4"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"
                        ></path>
                    </svg>
                    All Filters
                </button>
                <button
                    class="whitespace-nowrap px-4 py-1.5 rounded-full border border-gray-200 text-sm font-semibold text-gray-700 hover:bg-gray-50"
                >
                    Discounts
                </button>
                <button
                    class="whitespace-nowrap px-4 py-1.5 rounded-full border border-gray-200 text-sm font-semibold text-gray-700 hover:bg-gray-50"
                >
                    Open now
                </button>
                <button
                    class="whitespace-nowrap px-4 py-1.5 rounded-full border border-gray-200 text-sm font-semibold text-gray-700 hover:bg-gray-50"
                >
                    Pickup
                </button>
                <button
                    class="whitespace-nowrap px-4 py-1.5 rounded-full border border-gray-200 text-sm font-semibold text-gray-700 hover:bg-gray-50"
                >
                    Under 30 mins
                </button>
                <button
                    class="whitespace-nowrap px-4 py-1.5 rounded-full border border-purple-200 bg-purple-50 text-sm font-bold text-purple-700 hover:bg-purple-100"
                >
                    ⭐ CubrinPass
                </button>
            </div>
        </header>

        <main
            class="flex-1 flex flex-col items-center justify-center p-6 text-center mt-12 md:mt-20"
        >
            <div class="w-64 h-64 md:w-80 md:h-80 mb-8 relative">
                <img
                    src="./your-empty-image.png"
                    alt="Coming soon"
                    class="w-full h-full object-contain"
                />
            </div>

            <h1
                class="text-3xl md:text-4xl font-black text-gray-900 mb-4 tracking-tight leading-tight"
            >
                We're not here yet, but <br class="hidden sm:block" />
                we're coming soon!
            </h1>

            <p
                class="text-gray-500 font-medium max-w-md mx-auto mb-8 text-sm md:text-base"
            >
                Check back later or join our waitlist to get notified when we're
                live in your city.
            </p>

            <button
                class="bg-[#143D01] text-white px-8 py-3.5 rounded-full font-bold hover:scale-105 transition-transform flex items-center gap-2 shadow-lg shadow-[#143D01]/20"
            >
                Join the waitlist
                <svg
                    class="w-4 h-4"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M14 5l7 7m0 0l-7 7m7-7H3"
                    ></path>
                </svg>
            </button>
        </main>

        <style>
            .hide-scroll::-webkit-scrollbar {
                display: none;
            }
            .hide-scroll {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
        </style>
    </body>
</html>
