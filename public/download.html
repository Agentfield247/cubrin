    <script>
        function getMobileOS() {
            const ua = navigator.userAgent || navigator.vendor || window.opera || '';
            const platform = navigator.platform || '';
            if (/iPad|iPhone|iPod/.test(ua) || (platform === 'MacIntel' && navigator.maxTouchPoints > 1)) return 'iOS';
            if (/android/i.test(ua)) return 'Android';
            if (/Win/i.test(platform)) return 'Windows';
            if (/Mac/i.test(platform)) return 'Mac';
            return 'unknown';
        }

        window.addEventListener('load', function () {
            const os = getMobileOS();
            const APPLE = 'https://apps.apple.com/ng/app/cubrin/id6794402083';
            const ANDROID = 'https://play.google.com/store/apps/details?id=com.cubrin.mobile&hl=en_ZA';

            // Windows → Play Store, Mac → App Store, iOS → App Store, Android → Play Store
            if (os === 'iOS' || os === 'Mac') {
                window.location.href = APPLE;
            } else if (os === 'Android' || os === 'Windows') {
                window.location.href = ANDROID;
            } else {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('fallback').classList.remove('hidden');
            }
        });
